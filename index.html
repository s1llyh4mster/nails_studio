<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <header class="header-bg">
        <div class="container">
            <div class="row">
                <nav class="col-md-12 d-flex justify-content-center link-about">
                    <a class="link-btn" href="">Услуги</a>
                    <a class="link-btn" href="">Мастера</a>
                    <a class="link-btn" href="">Галерея</a>
                    <a class="link-btn" href="">Отзывы</a>
                    <a class="link-btn" href="">Контакты</a>
                </nav>
                <div class="col-md-12">
                    <img class="logo" src="../logo.png" alt="">
                </div>
                <div class="col-md-12 text-center">
                    <h1>Lumière Nails</h1>
                </div>
                <div class="col-md-12 text-center reg-btn">
                    <button class="big-btn">Записаться онлайн</button>
                </div>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="row">
                <div class="col">
                    <button class="main-btn">Записаться</button>
                    <button class="second-btn">Подробнее</button>
                    <button class="link-btn">Записаться</button>
                    <button class="mini-btn">Записаться</button>
                    <button class="big-btn">Записаться онлайн</button>
                </div>
            </div>
        </div>
    </section>

    <section class="mt-5">
        <div class="container">
            <div class="row">
                <div class="col">
                    <label for="fullName"></label>
                    <input type="text" class="text-field" placeholder="Введите ваше имя" name="fullName">

                    <textarea class="text-field-big" placeholder="Введите текст"></textarea>

                    <div class="search-wrapper mt-5">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-search search-icon" viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                        <label for="search"></label>
                        <input type="text" class="search" placeholder="Поиск" name="search">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="mt-5">
        <div class="container">
            <div class="row">
                <div class="col">
                    <label class="custom-checkbox">
                        <input type="checkbox" required>
                        <span class="checkmark"></span>
                        <span class="label-text">Согласен с условиями</span>
                    </label>
                </div>
            </div>
        </div>
    </section>

    <section class="mt-5">
        <div class="container">
            <div class="row">
                <div class="col-auto">
                    <div class="service-card">
                        <img class="card-img" src="nails.jpg" alt="аппаратный маникюр">

                        <div class="card-body">
                            <h3 class="card-title">Аппаратный маникюр</h3>
                            <p class="card-text">Идеальное покрытие, уход за кутикулой и укрепление ногтей. Длительность
                                — 1.5 часа.</p>
                            <h4 class="card-price">Цена: 2 500₽</h4>
                            <button class="mini-btn">Записаться</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h3>© 2026 Lumière Nails </h3>
                </div>
                <nav class="col-md-6 d-flex justify-content-end gap-3">
                    <a class="link-btn" href="">VK</a>
                    <a class="link-btn" href="">Telegram</a>
                    <a class="link-btn" href="">Instagram</a>
                </nav>
            </div>
        </div>
    </footer>
</body>

</html>
